# Bancos vetoriais que precisam de servidor. Chroma, Milvus Lite e o modo local do
# Qdrant rodam embarcados, sem contêiner.
#   docker compose -f infra/vectordbs.compose.yml up -d --wait
name: lang-family-vectordbs

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.41.0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true" # somente para uso local
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:15051:50051
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - 127.0.0.1:16333:6333
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 20
